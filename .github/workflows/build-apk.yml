name: Build OFESTRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Check project
        run: |
          test -f index.html
          echo "OFESTRA HTML found"

      - name: Build APK
        run: |
          echo "Build configuration needs Android project files."
